name: PickerHub release
# A tag v<version> builds signed installers on each system, gives the Debian package its final name,
# writes the updater manifest and opens a draft GitHub release for a person to review and publish.
# Credentials live only in the repository's secrets and variables (docs/release.md). The updater key
# is required. The Windows and Apple certificates are optional: without them the installers are built
# unsigned (Windows) or ad-hoc signed (macOS), and updates are still verified with the updater key.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles nsis
          - os: macos-15
            args: --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      SIGNED_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      SIGNED_MACOS: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      # The updater is compiled in only when the public key is present (src-tauri/src/update.rs).
      PICKERHUB_UPDATER_PUBKEY: ${{ vars.PICKERHUB_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a release without the updater key
        shell: bash
        run: |
          if [ -z "$PICKERHUB_UPDATER_PUBKEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Set PICKERHUB_UPDATER_PUBKEY (variable) and TAURI_SIGNING_PRIVATE_KEY (secret); see docs/release.md." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: rustup update stable && rustup default stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev fonts-noto-core
      - run: npm ci --prefix ui
      # Windows: when a code-signing certificate is set, it goes into the user's store and the build signs
      # with its thumbprint. Without one the installer is unsigned and SmartScreen warns on first run.
      - if: runner.os == 'Windows'
        name: Import the Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::No WINDOWS_CERTIFICATE: the Windows installer is unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Compress -Depth 4
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "signing.json") -Value $config
      - name: Build
        shell: bash
        env:
          # macOS: Tauri imports the certificate, signs with the hardened runtime and notarizes.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The updater plugin checks signatures with the public key in its config, which is empty in
          # tauri.conf.json: the repository variable fills it here (base64, so it is safe inside JSON).
          pubkey=$(printf '%s' "$PICKERHUB_UPDATER_PUBKEY" | tr -d '[:space:]')
          case "$pubkey" in *[!A-Za-z0-9+/=]*) echo "PICKERHUB_UPDATER_PUBKEY is not base64." >&2; exit 1;; esac
          printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "$pubkey" > "$RUNNER_TEMP/updater.json"
          extra=(--config "$RUNNER_TEMP/updater.json")
          if [ "$RUNNER_OS" = "Windows" ] && [ -f "$RUNNER_TEMP/signing.json" ]; then extra+=(--config "$RUNNER_TEMP/signing.json"); fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            # No Developer ID: sign ad hoc, so the app runs on Apple silicon. Gatekeeper asks once on first open.
            echo "::warning::No APPLE_SIGNING_IDENTITY: the macOS app is ad-hoc signed and not notarized."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            extra+=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
          fi
          ui/node_modules/.bin/tauri build --ci --config src-tauri/tauri.release.conf.json "${extra[@]}" --features updater ${{ matrix.args }}
      - if: runner.os == 'Linux'
        name: Final Debian package name, signed again
        run: python3 scripts/release_deb.py target/release/bundle/deb
      - if: runner.os == 'Windows' && env.SIGNED_WINDOWS == 'true'
        name: Verify the Windows signature
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid') { throw "$($_.Name): $($s.Status)" }
          }
      - if: runner.os == 'macOS'
        name: Verify the macOS signature (and notarization, with a Developer ID)
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGNED_MACOS" = "true" ]; then spctl --assess --type execute --verbose "$app"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/pickerhub_*.deb*
            target/release/bundle/rpm/*.rpm*
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/nsis/*-setup.exe*
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Updater manifest and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/latest_json.py "$version" release > release/latest.json
          # The artifacts keep their build folders (release/bundle/deb/…), but a release holds bare file
          # names: list each file by the name it is downloaded as, so `sha256sum -c SHA256SUMS` works
          # in the folder the downloads land in. Two files of one name would also clash on upload.
          (cd release
            dupes=$(find . -type f ! -name SHA256SUMS -printf '%f\n' | sort | uniq -d)
            if [ -n "$dupes" ]; then echo "Two release files share a name: $dupes" >&2; exit 1; fi
            find . -type f ! -name '*.sig' ! -name SHA256SUMS -printf '%P\n' | while read -r f; do
              (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
            done | sort -k2 > SHA256SUMS
            cat SHA256SUMS)
          cat release/latest.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # A reminder in the draft when an installer could not be signed (docs/release.md).
          SIGNED_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          SIGNED_MACOS: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          UNSIGNED=""
          if [ "$SIGNED_WINDOWS" != "true" ] || [ "$SIGNED_MACOS" != "true" ]; then
            UNSIGNED=" Before publishing, say in the notes that the Windows and/or macOS installers are unsigned and how to open them (docs/release.md)."
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "PickerHub ${GITHUB_REF_NAME#v}" \
            --notes "Draft: review the installers, then publish. The updater reads latest.json from the published release.${UNSIGNED}" \
            $(find release -type f)
