# Archived: the CI and preview releases of PickerHub 1.x, the Avalonia app in desktop/.
# PickerHub 2 (Tauri) replaced it with 2.0.0-beta.1; its CI is .github/workflows/tauri.yml and its
# releases .github/workflows/release.yml. GitHub runs only files in .github/workflows, so this one no
# longer runs. To build or release 1.x again, move it back:
#   git mv .github/workflows-archive/check.yml .github/workflows/check.yml
name: Native desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, rid: linux-x64}
          - {os: windows-latest, rid: win-x64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb libx11-dev xvfb openbox x11-utils x11-xserver-utils libxtst6 dbus-x11 python3-dbus python3-gi python3-pil gir1.2-gstreamer-1.0 pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-plugins-base
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo test --locked
      - run: python scripts/build.py --packages --rid ${{ matrix.rid }}
      - run: python tests/icon_checks.py --rid ${{ matrix.rid }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1400x900x24 -noreset' python tests/native_x11.py
      - if: runner.os == 'Linux'
        run: |
          dist/native/linux-x64/PickerHub/PickerHub --self-test
          python tests/release_checks.py
          xvfb-run -a python tests/hotkey_x11.py
          xvfb-run -a -s '-screen 0 1920x1200x24 -noreset' sh tests/run_ui_test.sh
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x900x24 -noreset' /usr/bin/python3 tests/shortcut_portal.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x900x24 -noreset' sh tests/run_portal_test.sh
      - if: runner.os == 'macOS'
        run: dist/native/${{ matrix.rid }}/PickerHub.app/Contents/MacOS/PickerHub --self-test
      - if: runner.os == 'Windows'
        run: dist/native/win-x64/PickerHub/PickerHub.exe --self-test
      - if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: dist/qa/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: pickerhub-${{ matrix.rid }}
          path: |
            dist/native/*.zip
            dist/native/*.tar.gz
            dist/native/*.deb
            dist/native/*.sha256
            dist/native/*.manifest.json
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'pickerhub-*', merge-multiple: true, path: dist}
      - name: Publish unsigned preview after every platform passes
        shell: bash
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('desktop/PickerHub.csproj').findtext('PropertyGroup/Version'))")
          # A preview is published once per version: pushes that do not bump desktop/PickerHub.csproj
          # find it already released and stop here instead of failing.
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::PickerHub $version is already released; nothing to publish."
            exit 0
          fi
          gh release create "v$version" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PickerHub $version — unsigned preview" --notes-file docs/release-notes.md --prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
