[package]
name = "pickerhub"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Offline Arabic color workbench for designers and developers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
