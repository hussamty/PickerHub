<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PickerHub mark: the letter P built from the eyedropper lens. The bowl is the lens well,
       the square inside it is the picked pixel, and the stem tapers into the dropper's tip. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232321"/>
      <stop offset="1" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".10"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
    <clipPath id="well"><rect x="388" y="272" width="308" height="308" rx="74"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#ground)"/>
    <g id="mark" transform="translate(-30 -12)">
      <!-- Neighbouring pixels seen through the lens; dropped at small sizes. -->
      <g id="detail" clip-path="url(#well)">
        <rect x="388" y="272" width="308" height="308" fill="#161615"/>
        <g>
          <rect x="402" y="286" width="84" height="84" rx="14" fill="#2B2B28"/>
          <rect x="500" y="286" width="84" height="84" rx="14" fill="#3A3A36"/>
          <rect x="598" y="286" width="84" height="84" rx="14" fill="#2B2B28"/>
          <rect x="402" y="384" width="84" height="84" rx="14" fill="#3A3A36"/>
          <rect x="598" y="384" width="84" height="84" rx="14" fill="#4A4A45"/>
          <rect x="402" y="482" width="84" height="84" rx="14" fill="#2B2B28"/>
          <rect x="500" y="482" width="84" height="84" rx="14" fill="#4A4A45"/>
          <rect x="598" y="482" width="84" height="84" rx="14" fill="#3A3A36"/>
        </g>
        <rect x="500" y="384" width="84" height="84" rx="14" fill="#FFFFFF"/>
      </g>
      <rect id="pixel" x="472" y="356" width="140" height="140" rx="30" fill="#FFFFFF" display="none"/>
      <path fill="#FFF000" fill-rule="evenodd" d="M462 176 H622 A170 170 0 0 1 792 346 V506 A170 170 0 0 1 622 676 H388 V752 L366 846 Q361 868 340 868 Q319 868 314 846 L292 752 V346 A170 170 0 0 1 462 176 Z M462 272 A74 74 0 0 0 388 346 V580 H622 A74 74 0 0 0 696 506 V346 A74 74 0 0 0 622 272 Z"/>
    </g>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
