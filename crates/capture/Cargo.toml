[package]
name = "pickerhub-capture"
version = "2.0.0-beta.2"
edition = "2024"
license = "MIT"
description = "PickerHub screen color sampling: X11, Wayland portals, Windows and macOS"

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screenshot", "screencast"] }
libloading = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSampler", "NSColorSpace", "block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
png = "0.17"
