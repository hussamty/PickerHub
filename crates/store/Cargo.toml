[package]
name = "pickerhub-store"
version = "2.0.0-beta.3"
edition = "2024"
license = "MIT"
description = "PickerHub library storage: the workspace file, recovery, backups and edit history"

[dependencies]
pickerhub = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
