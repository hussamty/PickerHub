# cargo-deny: advisories, licenses and sources for the whole workspace (docs/tauri-migration-plan.md 10).
[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "0BSD", "CDLA-Permissive-2.0"]
